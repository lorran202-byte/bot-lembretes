<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f4f1ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131311" media="(prefers-color-scheme: dark)">
<title>Lembretes de treino</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#f4f1ec;--card:#fff;--ink:#1c1b19;--muted:#6f6a62;--line:#e4dfd6;--soft:#ece7de;
  --accent:#0f7b4f;--accent-ink:#fff;--accent-bg:#e2f2ea;
  --no:#b3261e;--no-bg:#fbeceb;--wait:#8a5a00;--wait-bg:#fbf1dc;--off:#8b867d;--off-bg:#efebe4;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#131311;--card:#1e1d1a;--ink:#f1ede6;--muted:#a19b90;--line:#33312c;--soft:#2a2925;
  --accent:#3fbf86;--accent-ink:#06210f;--accent-bg:#173527;
  --no:#f2857c;--no-bg:#3a1d1a;--wait:#f0c066;--wait-bg:#3a2e14;--off:#9a958c;--off-bg:#2a2925;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
main{max-width:560px;margin:0 auto;padding:18px 16px calc(96px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 18px}
header h1{font-size:22px;margin:0;letter-spacing:-.01em}
.dot{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);background:var(--card);border:1px solid var(--line);padding:6px 10px;border-radius:99px;white-space:nowrap}
.dot i{width:8px;height:8px;border-radius:50%;background:var(--off)}
.dot.on i{background:var(--accent)}.dot.warn i{background:var(--wait)}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:24px 2px 10px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.stack>*+*{margin-top:10px}
.muted{color:var(--muted)}.small{font-size:14px}
.banner{border-radius:14px;padding:14px 16px;margin-bottom:14px;background:var(--wait-bg);color:var(--wait);font-size:15px}
.banner b{color:inherit}.banner button{margin-top:10px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.item{display:flex;align-items:center;gap:12px;padding:14px 16px}
.item+.item{border-top:1px solid var(--line)}
.time{font-variant-numeric:tabular-nums;font-weight:700;font-size:18px;width:54px}
.name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:12.5px;font-weight:600;padding:4px 9px;border-radius:99px;white-space:nowrap;background:var(--off-bg);color:var(--off)}
.pill.confirmado{background:var(--accent-bg);color:var(--accent)}
.pill.cancelado,.pill.erro{background:var(--no-bg);color:var(--no)}
.pill.pendente,.pill.enviando{background:var(--wait-bg);color:var(--wait)}
.list{padding:0;overflow:hidden}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;cursor:pointer;background:var(--soft);color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--no-bg);color:var(--no)}
.btn.block{display:block;width:100%}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.5}
.icon{background:none;border:0;padding:8px;margin:-8px;color:var(--muted);cursor:pointer;font-size:20px;line-height:1}
label{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
label:first-child{margin-top:0}
input[type=text],input[type=tel],input[type=password],input[type=time],input[type=number],select,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
textarea{min-height:170px;resize:vertical;line-height:1.4}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 0;width:calc((100% - 36px)/7);text-align:center;font-size:14px;cursor:pointer;user-select:none}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.slot{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border-radius:10px;padding:6px 6px 6px 10px;font-size:14px;margin:0 6px 6px 0;font-variant-numeric:tabular-nums}
.slot button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;padding:0 4px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0 0;font-weight:600;font-size:15px}
.switch input{appearance:none;width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:.2s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px #0003}
.switch input:checked{background:var(--accent)}.switch input:checked::after{left:21px}
.preview{white-space:pre-wrap;background:var(--accent-bg);border-radius:12px 12px 12px 4px;padding:12px 14px;font-size:15px;margin-top:10px}
.code{font:700 34px/1 ui-monospace,Menlo,monospace;letter-spacing:.12em;text-align:center;background:var(--soft);border-radius:12px;padding:18px 8px;margin:12px 0}
#qr{display:flex;justify-content:center;background:#fff;padding:14px;border-radius:12px;margin:12px auto;width:max-content}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav div{display:flex;width:100%;max-width:560px}
nav button{flex:1;border:0;background:none;padding:10px 4px 12px;font-size:12px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button span{font-size:21px;line-height:1}
nav button.on{color:var(--accent);font-weight:700}
.sheet-bg{position:fixed;inset:0;background:#0007;z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 14px;font-size:20px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:90vw}
.sum{display:flex;gap:8px;margin-bottom:4px}
.sum div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.sum b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.sum span{font-size:12.5px;color:var(--muted)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <header>
    <h1 id="titulo">Lembretes</h1>
    <div class="dot" id="statusDot"><i></i><span>…</span></div>
  </header>
  <div id="banner"></div>

  <section id="tab-hoje"></section>
  <section id="tab-alunos" hidden></section>
  <section id="tab-ajustes" hidden></section>
  <section id="tab-whatsapp" hidden></section>
</main>

<nav><div>
  <button data-tab="hoje" class="on"><span>📅</span>Agenda</button>
  <button data-tab="alunos"><span>👥</span>Alunos</button>
  <button data-tab="ajustes"><span>⚙️</span>Ajustes</button>
  <button data-tab="whatsapp"><span>💬</span>WhatsApp</button>
</div></nav>

<script>
const DIAS = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const ORDEM = [1,2,3,4,5,6,0];
let E = null, ALUNOS = [], AGENDA = [], aba = 'hoje';

const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fone = (t) => { const d = String(t||'').replace(/\D/g,''); const l = d.startsWith('55') ? d.slice(2) : d; return l.length >= 10 ? `(${l.slice(0,2)}) ${l.slice(2,-4)}-${l.slice(-4)}` : t; };

async function api(path, opts = {}) {
  const r = await fetch(path, { method: opts.method || 'GET', headers: { 'Content-Type': 'application/json', 'X-Painel': '1' }, body: opts.body ? JSON.stringify(opts.body) : undefined });
  if (r.status === 401) { location.reload(); throw new Error('Sessão expirada'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.erro || 'Erro');
  return j;
}
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2800);
}
async function acao(btn, fn, ok) {
  if (btn) btn.disabled = true;
  try { await fn(); if (ok) toast(ok); } catch (e) { toast(e.message); } finally { if (btn) btn.disabled = false; }
}

// ---------- navegação ----------
document.querySelectorAll('nav button').forEach((b) => b.onclick = () => irPara(b.dataset.tab));
function irPara(t) {
  aba = t;
  document.querySelectorAll('nav button').forEach((b) => b.classList.toggle('on', b.dataset.tab === t));
  document.querySelectorAll('main section').forEach((s) => s.hidden = s.id !== 'tab-' + t);
  render();
  scrollTo(0, 0);
}

async function carregar() {
  const [e, a, g] = await Promise.all([api('/api/estado'), api('/api/alunos'), api('/api/agenda?dias=3')]);
  E = e; ALUNOS = a.alunos; AGENDA = g.itens;
  render();
}

function render() {
  if (!E) return;
  const w = E.whatsapp, dot = $('#statusDot');
  const on = w.status === 'conectado';
  dot.className = 'dot ' + (on ? (E.config.pausado ? 'warn' : 'on') : 'warn');
  dot.querySelector('span').textContent = on ? (E.config.pausado ? 'Pausado' : 'Conectado') : (w.status === 'conectando' ? 'Conectando…' : 'Desconectado');

  let ban = '';
  if (!on && w.status !== 'conectando') ban = `<div class="banner"><b>WhatsApp desconectado.</b> Os lembretes não serão enviados até você conectar.<br><button class="btn sm primary" onclick="irPara('whatsapp')">Conectar agora</button></div>`;
  else if (E.config.pausado) ban = `<div class="banner"><b>Envios pausados.</b> Nenhum lembrete será enviado.<br><button class="btn sm primary" onclick="setPausa(false)">Retomar envios</button></div>`;
  else if (!E.config.telefonePersonal && aba !== 'ajustes') ban = `<div class="banner">Coloque seu número em <b>Ajustes</b> para receber o aviso quando um aluno responder.<br><button class="btn sm" onclick="irPara('ajustes')">Abrir ajustes</button></div>`;
  $('#banner').innerHTML = ban;

  ({ hoje: renderHoje, alunos: renderAlunos, ajustes: renderAjustes, whatsapp: renderWhats })[aba]();
}

// ---------- agenda ----------
function renderHoje() {
  const el = $('#tab-hoje');
  if (!ALUNOS.length) {
    el.innerHTML = `<div class="card empty"><div style="font-size:40px">👋</div><p>Cadastre seus alunos particulares e os horários de treino.<br>O bot manda o lembrete sozinho.</p><button class="btn primary" onclick="irPara('alunos');editarAluno()">Cadastrar primeiro aluno</button></div>`;
    return;
  }
  const porDia = {};
  for (const i of AGENDA) (porDia[i.data] ||= []).push(i);
  const hoje = AGENDA.filter((i) => i.dia === 'hoje');
  const c = (s) => hoje.filter((i) => i.status === s).length;
  let h = `<div class="sum">
    <div><b>${hoje.length}</b><span>treinos hoje</span></div>
    <div><b style="color:var(--accent)">${c('confirmado')}</b><span>confirmaram</span></div>
    <div><b style="color:var(--no)">${c('cancelado')}</b><span>não vão</span></div>
    <div><b style="color:var(--wait)">${c('pendente')}</b><span>sem resposta</span></div>
  </div>`;
  const dias = Object.keys(porDia).sort();
  if (!dias.length) h += `<div class="card empty" style="margin-top:14px">Nenhum treino hoje nem nos próximos dias.</div>`;
  for (const d of dias) {
    const it = porDia[d];
    const titulo = it[0].dia === 'hoje' || it[0].dia === 'amanhã' ? it[0].dia[0].toUpperCase() + it[0].dia.slice(1) + ' · ' + it[0].diaCurto : it[0].diaCurto;
    h += `<h2>${esc(titulo)}</h2><div class="card list">`;
    for (const i of it) {
      const quando = i.status === 'agendado' ? `Lembrete às ${new Date(i.envioEm).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',timeZone:'America/Fortaleza'})}` : (i.erro ? esc(i.erro) : '');
      h += `<div class="item" onclick="abrirTreino('${esc(i.chave)}')" style="cursor:pointer">
        <div class="time">${esc(i.hora)}</div>
        <div class="grow"><div class="name">${esc(i.nome)}</div>${quando ? `<div class="small muted">${quando}</div>` : ''}</div>
        <span class="pill ${esc(i.status)}">${esc(i.rotulo)}</span>
      </div>`;
    }
    h += `</div>`;
  }
  el.innerHTML = h;
}

function abrirTreino(chave) {
  const i = AGENDA.find((x) => x.chave === chave); if (!i) return;
  const pode = i.inicio > Date.now();
  const enviado = ['pendente','confirmado','cancelado','erro'].includes(i.status);
  sheet(`<h3>${esc(i.nome)}</h3>
    <p class="muted" style="margin-top:-8px">${esc(i.diaCurto)} às ${esc(i.hora)} · ${esc(fone(i.telefone))}</p>
    <p><span class="pill ${esc(i.status)}">${esc(i.rotulo)}</span></p>
    ${i.erro ? `<p class="small" style="color:var(--no)">${esc(i.erro)}</p>` : ''}
    <div class="stack" style="margin-top:16px">
      ${pode && i.status !== 'pulado' ? `<button class="btn primary block" id="bEnv">${enviado ? 'Reenviar lembrete agora' : 'Enviar lembrete agora'}</button>` : ''}
      ${pode && i.status === 'agendado' ? `<button class="btn block" id="bPul">Não enviar este lembrete</button>` : ''}
      ${i.status === 'pulado' ? `<button class="btn block" id="bVol">Voltar a enviar</button>` : ''}
      <a class="btn block" style="text-align:center;text-decoration:none" href="https://wa.me/${esc(i.telefone)}" target="_blank" rel="noopener">Abrir conversa no WhatsApp</a>
      <button class="btn block" onclick="fecharSheet()">Fechar</button>
    </div>`);
  const r = async () => { fecharSheet(); await carregar(); };
  $('#bEnv')?.addEventListener('click', (ev) => acao(ev.target, async () => { const s = await api('/api/agenda/enviar', { method:'POST', body:{ chave } }); if (s.sessao.status === 'erro') throw new Error(s.sessao.erro); await r(); }, 'Lembrete enviado'));
  $('#bPul')?.addEventListener('click', (ev) => acao(ev.target, async () => { await api('/api/agenda/pular', { method:'POST', body:{ chave, pular:true } }); await r(); }, 'Esse lembrete não será enviado'));
  $('#bVol')?.addEventListener('click', (ev) => acao(ev.target, async () => { await api('/api/agenda/pular', { method:'POST', body:{ chave, pular:false } }); await r(); }));
}

// ---------- alunos ----------
function renderAlunos() {
  const el = $('#tab-alunos');
  let h = `<button class="btn primary block" onclick="editarAluno()">+ Novo aluno</button>`;
  if (!ALUNOS.length) h += `<div class="card empty" style="margin-top:14px">Nenhum aluno cadastrado ainda.</div>`;
  else {
    const ord = [...ALUNOS].sort((a, b) => a.nome.localeCompare(b.nome));
    h += `<div class="card list" style="margin-top:14px">`;
    for (const a of ord) {
      const hs = a.horarios.map((x) => `${DIAS[x.dia]} ${x.hora}`).join(' · ') || 'Sem horários';
      h += `<div class="item" onclick="editarAluno('${a.id}')" style="cursor:pointer;${a.ativo ? '' : 'opacity:.55'}">
        <div class="grow"><div class="name">${esc(a.nome)}${a.ativo ? '' : ' <span class="pill">pausado</span>'}</div><div class="small muted">${esc(hs)}</div></div>
        <span class="muted">›</span></div>`;
    }
    h += `</div>`;
  }
  el.innerHTML = h;
}

function editarAluno(id) {
  const a = ALUNOS.find((x) => x.id === id) || { nome: '', telefone: '', ativo: true, horarios: [] };
  let horarios = a.horarios.map((x) => ({ ...x }));
  let diasSel = new Set();
  sheet(`<h3>${id ? 'Editar aluno' : 'Novo aluno'}</h3>
    <label>Nome</label><input type="text" id="fNome" value="${esc(a.nome)}" placeholder="Ex: Maria Souza" autocomplete="off">
    <label>WhatsApp</label><input type="tel" id="fTel" value="${esc(a.telefone ? fone(a.telefone) : '')}" placeholder="(99) 98123-4567" inputmode="tel">
    <label>Horários de treino</label>
    <div id="fSlots"></div>
    <div class="card" style="background:var(--bg);padding:12px">
      <div class="small muted" style="margin-bottom:8px">Marque os dias e o horário, depois toque em Adicionar</div>
      <div class="chips" id="fDias">${ORDEM.map((d) => `<div class="chip" data-d="${d}">${DIAS[d]}</div>`).join('')}</div>
      <div class="row" style="margin-top:10px"><input type="time" id="fHora" value="17:00" class="grow"><button class="btn" id="fAdd">Adicionar</button></div>
    </div>
    <label class="switch">Enviar lembretes para este aluno<input type="checkbox" id="fAtivo" ${a.ativo ? 'checked' : ''}></label>
    <div class="stack" style="margin-top:20px">
      <button class="btn primary block" id="fSalvar">Salvar</button>
      ${id ? `<button class="btn danger block" id="fExcluir">Excluir aluno</button>` : ''}
      <button class="btn block" onclick="fecharSheet()">Cancelar</button>
    </div>`);
  const desenhar = () => {
    const ord = [...horarios].sort((x, y) => ORDEM.indexOf(x.dia) - ORDEM.indexOf(y.dia) || x.hora.localeCompare(y.hora));
    $('#fSlots').innerHTML = ord.length ? ord.map((x) => `<span class="slot">${DIAS[x.dia]} ${x.hora}<button data-k="${x.dia}|${x.hora}" aria-label="Remover">×</button></span>`).join('') : '<div class="hint" style="margin:0 0 10px">Nenhum horário ainda.</div>';
    $('#fSlots').querySelectorAll('button').forEach((b) => b.onclick = () => { const [d, hh] = b.dataset.k.split('|'); horarios = horarios.filter((x) => !(x.dia == d && x.hora === hh)); desenhar(); });
  };
  desenhar();
  $('#fDias').querySelectorAll('.chip').forEach((c) => c.onclick = () => { const d = +c.dataset.d; diasSel.has(d) ? diasSel.delete(d) : diasSel.add(d); c.classList.toggle('on'); });
  $('#fAdd').onclick = () => {
    const hora = $('#fHora').value;
    if (!diasSel.size) return toast('Marque pelo menos um dia');
    if (!hora) return toast('Escolha o horário');
    for (const d of diasSel) if (!horarios.some((x) => x.dia === d && x.hora === hora)) horarios.push({ dia: d, hora });
    diasSel.clear(); $('#fDias').querySelectorAll('.chip').forEach((c) => c.classList.remove('on'));
    desenhar();
  };
  $('#fSalvar').onclick = (ev) => acao(ev.target, async () => {
    const body = { nome: $('#fNome').value, telefone: $('#fTel').value, ativo: $('#fAtivo').checked, horarios };
    if (!horarios.length && !confirm('Salvar sem nenhum horário? O aluno não receberá lembretes.')) return;
    await api(id ? '/api/alunos/' + id : '/api/alunos', { method: id ? 'PUT' : 'POST', body });
    fecharSheet(); await carregar();
  }, 'Aluno salvo');
  $('#fExcluir')?.addEventListener('click', (ev) => {
    if (!confirm(`Excluir ${a.nome}?`)) return;
    acao(ev.target, async () => { await api('/api/alunos/' + id, { method: 'DELETE' }); fecharSheet(); await carregar(); }, 'Aluno excluído');
  });
}

// ---------- ajustes ----------
function renderAjustes() {
  const c = E.config;
  const opts = [[30,'30 minutos'],[60,'1 hora'],[90,'1h30'],[120,'2 horas'],[180,'3 horas'],[240,'4 horas'],[360,'6 horas'],[720,'12 horas'],[1440,'1 dia antes']];
  if (!opts.some((o) => o[0] === +c.antecedenciaMin)) opts.push([+c.antecedenciaMin, c.antecedenciaMin + ' min']);
  $('#tab-ajustes').innerHTML = `
    <div class="card">
      <label>Seu nome (aparece na mensagem)</label><input type="text" id="aNome" value="${esc(c.personal)}" placeholder="Ex: Prof. Lorran">
      <label>Seu WhatsApp (para receber os avisos)</label><input type="tel" id="aTel" value="${esc(c.telefonePersonal ? fone(c.telefonePersonal) : '')}" placeholder="(99) 98123-4567">
      <label class="switch">Me avisar quando um aluno responder<input type="checkbox" id="aAvisar" ${c.avisarPersonal ? 'checked' : ''}></label>
      <label>Mandar o lembrete quanto tempo antes</label>
      <select id="aAnt">${opts.map(([v, t]) => `<option value="${v}" ${v == c.antecedenciaMin ? 'selected' : ''}>${t}</option>`).join('')}</select>
    </div>
    <h2>Mensagem</h2>
    <div class="card">
      <textarea id="aMsg">${esc(c.mensagem)}</textarea>
      <div class="hint">Use {nome}, {dia}, {hora}, {link} e {personal}. O {link} é obrigatório. *texto* deixa em negrito.</div>
      <div class="actions"><button class="btn sm" id="aPrev">Ver prévia</button><button class="btn sm" id="aPad">Voltar ao padrão</button></div>
      <div id="aPreview"></div>
    </div>
    <button class="btn primary block" id="aSalvar" style="margin-top:16px">Salvar ajustes</button>
    <h2>Envios</h2>
    <div class="card">
      <label class="switch" style="margin:0">Pausar todos os lembretes<input type="checkbox" id="aPausa" ${c.pausado ? 'checked' : ''}></label>
      <div class="hint">Útil em feriados ou férias.</div>
    </div>
    <div style="text-align:center;margin-top:28px"><a href="/sair" class="muted small">Sair do painel</a></div>`;
  $('#aPrev').onclick = (ev) => acao(ev.target, async () => { const r = await api('/api/previa', { method:'POST', body:{ mensagem: $('#aMsg').value } }); $('#aPreview').innerHTML = `<div class="preview">${esc(r.texto).replace(/\*([^*\n]+)\*/g,'<b>$1</b>')}</div>`; });
  $('#aPad').onclick = () => { $('#aMsg').value = E.mensagemPadrao; $('#aPreview').innerHTML = ''; };
  $('#aPausa').onchange = (ev) => setPausa(ev.target.checked);
  $('#aSalvar').onclick = (ev) => acao(ev.target, async () => {
    await api('/api/config', { method:'PUT', body:{ personal: $('#aNome').value, telefonePersonal: $('#aTel').value, avisarPersonal: $('#aAvisar').checked, antecedenciaMin: +$('#aAnt').value, mensagem: $('#aMsg').value } });
    await carregar();
  }, 'Ajustes salvos');
}
async function setPausa(v) { await acao(null, async () => { await api('/api/config', { method:'PUT', body:{ pausado: v } }); await carregar(); }, v ? 'Envios pausados' : 'Envios retomados'); }

// ---------- whatsapp ----------
let qrDesenhado = null;
function renderWhats() {
  const w = E.whatsapp, el = $('#tab-whatsapp');
  if (w.status === 'conectado') {
    if (el.dataset.montado === 'on' && $('#wEnv', el)) return; // já está na tela
    qrDesenhado = null;
    el.dataset.montado = 'on';
    el.innerHTML = `<div class="card">
      <div style="font-size:40px">✅</div>
      <h3 style="margin:6px 0">WhatsApp conectado</h3>
      <p class="muted" style="margin:0">Número: ${esc(fone(w.numero))}</p>
    </div>
    <h2>Testar</h2>
    <div class="card">
      <label>Mandar uma mensagem de teste para</label>
      <input type="tel" id="wTeste" value="${esc(E.config.telefonePersonal ? fone(E.config.telefonePersonal) : '')}" placeholder="(99) 98123-4567">
      <button class="btn primary block" id="wEnv" style="margin-top:10px">Enviar teste</button>
    </div>
    <h2>Desconectar</h2>
    <div class="card"><p class="muted small" style="margin-top:0">Desconecte só se quiser trocar o número que envia os lembretes.</p><button class="btn danger block" id="wSair">Desconectar WhatsApp</button></div>`;
    $('#wEnv').onclick = (ev) => acao(ev.target, () => api('/api/whatsapp/teste', { method:'POST', body:{ telefone: $('#wTeste').value } }), 'Teste enviado');
    $('#wSair').onclick = (ev) => { if (confirm('Desconectar o WhatsApp? Os lembretes param até você conectar de novo.')) acao(ev.target, async () => { await api('/api/whatsapp/desconectar', { method:'POST' }); await carregar(); }); };
    return;
  }
  if (!el.dataset.montado || el.dataset.montado === 'on') {
    el.dataset.montado = 'off';
    el.innerHTML = `<div class="card">
      <h3 style="margin:0 0 6px">Conectar pelo número <span class="pill confirmado">mais fácil no celular</span></h3>
      <ol class="small" style="padding-left:20px;margin:8px 0 0">
        <li>Digite abaixo o número do WhatsApp que vai mandar os lembretes e toque em <b>Gerar código</b>.</li>
        <li>No WhatsApp desse número: <b>⋮ ou Configurações › Aparelhos conectados › Conectar um aparelho</b>.</li>
        <li>Toque em <b>Conectar com número de telefone</b> e digite o código.</li>
      </ol>
      <label>Número que vai enviar</label>
      <input type="tel" id="wNum" placeholder="(99) 98123-4567">
      <button class="btn primary block" id="wCod" style="margin-top:10px">Gerar código</button>
      <div id="wCodigo"></div>
    </div>
    <h2>Ou pelo QR Code</h2>
    <div class="card" style="text-align:center">
      <p class="small muted" style="margin-top:0">Abra esta página em outro aparelho (computador ou outro celular) e escaneie em <b>Aparelhos conectados › Conectar um aparelho</b>.</p>
      <div id="qrBox"></div>
    </div>`;
    $('#wCod').onclick = (ev) => acao(ev.target, async () => {
      $('#wCodigo').innerHTML = '<p class="muted small">Gerando… pode levar alguns segundos.</p>';
      try { const r = await api('/api/whatsapp/codigo', { method:'POST', body:{ telefone: $('#wNum').value } });
        $('#wCodigo').innerHTML = `<div class="code">${esc(r.codigo.slice(0,4))}-${esc(r.codigo.slice(4))}</div><p class="small muted" style="text-align:center">Digite esse código no WhatsApp. Ele vale por poucos minutos.</p>`;
      } catch (e) { $('#wCodigo').innerHTML = ''; throw e; }
    });
  }
  const box = $('#qrBox');
  if (w.qr && w.qr !== qrDesenhado && window.QRCode) {
    qrDesenhado = w.qr; box.innerHTML = '<div id="qr"></div>';
    new QRCode($('#qr'), { text: w.qr, width: 236, height: 236, correctLevel: QRCode.CorrectLevel.L });
  } else if (!w.qr) {
    qrDesenhado = null; box.innerHTML = `<p class="muted">${w.status === 'conectando' ? 'Preparando conexão…' : 'Aguardando…'}</p>${w.erro ? `<p class="small" style="color:var(--no)">${esc(w.erro)}</p>` : ''}`;
  }
}

// ---------- sheet ----------
function sheet(html) {
  fecharSheet();
  const bg = document.createElement('div'); bg.className = 'sheet-bg'; bg.id = 'sheet';
  bg.innerHTML = `<div class="sheet">${html}</div>`;
  bg.onclick = (e) => { if (e.target === bg) fecharSheet(); };
  document.body.appendChild(bg); document.body.style.overflow = 'hidden';
}
function fecharSheet() { $('#sheet')?.remove(); document.body.style.overflow = ''; }

// ---------- atualização ----------
carregar().catch((e) => toast(e.message));
setInterval(async () => {
  if ($('#sheet')) return; // não atrapalha quem está editando
  try {
    const e = await api('/api/estado');
    const mudouWa = !E || e.whatsapp.status !== E.whatsapp.status;
    E = e;
    if (aba === 'whatsapp') render();
    if (aba === 'hoje' || mudouWa) { const g = await api('/api/agenda?dias=3'); AGENDA = g.itens; render(); }
  } catch {}
}, 5000);
</script>
</body>
